name: Document extraction

on:
  push:
    branches: [main]
    tags:
      - "document-extraction/v*"
      - "document-extraction/*/v*"
    paths:
      - 'DocumentExtraction/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'CommunityToolkit.AI.slnx'
      - 'global.json'
      - 'nuget.config'
      - 'eng/LegacySupport.props'
      - 'Shared/**'
      - '.github/workflows/document-extraction.yml'
  pull_request:
    branches: [main, 'copilot/*']
    paths:
      - 'DocumentExtraction/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'CommunityToolkit.AI.slnx'
      - 'global.json'
      - 'nuget.config'
      - 'eng/LegacySupport.props'
      - 'Shared/**'
      - '.github/workflows/document-extraction.yml'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore DocumentExtraction/DocumentExtraction.slnf --configfile nuget.config
      - name: Build
        run: dotnet build DocumentExtraction/DocumentExtraction.slnf --no-restore -c Release
      - name: Test
        run: dotnet test DocumentExtraction/DocumentExtraction.slnf --no-build --no-restore -c Release

  package:
    name: Package
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Parse release tag
        id: tag
        run: |
          rest="${GITHUB_REF_NAME#document-extraction/}"
          if [[ "$rest" == v* ]]; then
            version="${rest#v}"
            echo "pack_target=DocumentExtraction/DocumentExtraction.slnf" >> "$GITHUB_OUTPUT"
          else
            provider="${rest%%/v*}"
            version="${rest#*/v}"
            echo "pack_target=DocumentExtraction/src/$provider/$provider.csproj" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore DocumentExtraction/DocumentExtraction.slnf --configfile nuget.config

      - name: Pack NuGet packages
        env:
          PACK_TARGET: ${{ steps.tag.outputs.pack_target }}
          PACKAGE_VERSION: ${{ steps.tag.outputs.version }}
        run: >
          dotnet pack "$PACK_TARGET"
          --no-restore
          -c Release
          -o ./nuget
          -p:PackageVersion="$PACKAGE_VERSION"
          -p:CI=true

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v6
        with:
          name: nuget-packages
          path: ./nuget
          if-no-files-found: error

      - name: Upload signing file list
        uses: actions/upload-artifact@v6
        with:
          name: nuget-list
          path: ${{ github.workspace }}/.github/workflows/SignClientFileList.txt
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    secrets: inherit