name: Document extraction

on:
  push:
    branches: [main]
    paths:
      - 'DocumentExtraction/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'CommunityToolkit.AI.slnx'
      - 'global.json'
      - 'eng/Test-DocumentExtractionPackages.ps1'
      - 'eng/DocumentExtraction.PackageSmoke/**'
      - 'eng/LegacySupport.props'
      - 'Shared/**'
      - 'nuget.config'
      - '.github/workflows/document-extraction.yml'
  pull_request:
    branches: [main, 'copilot/*']
    paths:
      - 'DocumentExtraction/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'CommunityToolkit.AI.slnx'
      - 'global.json'
      - 'eng/Test-DocumentExtractionPackages.ps1'
      - 'eng/DocumentExtraction.PackageSmoke/**'
      - 'eng/LegacySupport.props'
      - 'Shared/**'
      - 'nuget.config'
      - '.github/workflows/document-extraction.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test-pack:
    name: Build, test and pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore DocumentExtraction/DocumentExtraction.slnf
      - name: Build
        run: dotnet build DocumentExtraction/DocumentExtraction.slnf --no-restore -c Release
      - name: Test
        run: dotnet test DocumentExtraction/DocumentExtraction.slnf --no-build --no-restore -c Release
      - name: Restore portable test dependency closure
        run: dotnet restore DocumentExtraction/DocumentExtraction.slnf -p:DocumentExtractionTestAsset=netstandard2.0
      - name: Test using actual netstandard assets
        run: dotnet test DocumentExtraction/DocumentExtraction.slnf --no-restore -c Release -p:DocumentExtractionTestAsset=netstandard2.0
      - name: Pack preview artifacts
        run: dotnet pack DocumentExtraction/DocumentExtraction.slnf --no-build --no-restore -c Release --output artifacts/document-extraction
      - name: Verify packaged assets and experimental opt-in
        shell: pwsh
        run: ./eng/Test-DocumentExtractionPackages.ps1 -PackageDirectory artifacts/document-extraction -OutputDirectory "${{ runner.temp }}/document-extraction-package-checks"
      - uses: actions/upload-artifact@v6
        with:
          name: document-extraction-preview-packages-${{ matrix.os }}
          path: artifacts/document-extraction/*.nupkg
          if-no-files-found: error